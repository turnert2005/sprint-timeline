<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sprint Timeline preview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding: 0; background: #888; }
    .pv { padding: 12px 16px 16px; margin: 0 0 12px; width: 1000px; background: var(--background-color); color: var(--text-primary-color); }
    /* The theme variables Azure DevOps injects, light and dark, as the host sets them. */
    .light { --background-color: #fff; --text-primary-color: rgba(0, 0, 0, 0.9); --text-secondary-color: rgba(0, 0, 0, 0.55); --palette-neutral-4: 244, 244, 244; --palette-neutral-8: 234, 234, 234; --palette-neutral-20: 200, 200, 200; --communication-foreground: #0078D4; --communication-background: #0078D4; }
    .dark { --background-color: #1e1e1e; --text-primary-color: rgba(255, 255, 255, 0.95); --text-secondary-color: rgba(255, 255, 255, 0.6); --palette-neutral-4: 37, 36, 35; --palette-neutral-8: 59, 58, 57; --palette-neutral-20: 72, 70, 68; --communication-foreground: #4FA3E0; --communication-background: #0078D4; }
  </style>
</head>
<body>
  <div id="light" class="pv light"></div>
  <div id="dark" class="pv dark"></div>
  <script src="../dist/preview.js"></script>
</body>
</html>
